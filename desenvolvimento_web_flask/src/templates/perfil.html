{% extends 'base.html' %}

{% block body %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p3 mb-4">
                <div class="d-flex align-items-center">
                    <div class="image pe-3">
                        <img src="{{foto_perfil}}" class="rounded" width="200">
                    </div>
                    <div class="w-100">
                        <h4 class="mb-0 mt-0">{{current_user.username}}</h4>
                        <span>{{current_user.email}}</span>
                        <div class="p-2 mt-2 bg-primary d-flex justify-content-between rounded text-white stats">
                            <div class="d-flex flex-column">
                                <span class="articles">Cursos</span>
                                <span class="number1">{{current_user.total_cursos}}</span>
                            </div>
                            <div class="d-flex flex-column">
                                <span class="rating">Posts</span>
                                <span class="number1">{{current_user.contar_post()}}</span>
                            </div>
                        </div>
                        <div class="button mt-2 d-flex flex-row align-items-center">
                            <a class="w-100" href="{{url_for('main.editar_perfil')}}">
                                <button class="btn btn-sm btn-outline-primary w-100">Editar Perfil</button>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            {% block form_editar_perfil %}
            {% endblock %}
        </div>
    </div>
</div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p3 mb-4">
                <strong style="text-align: center">Cursos</strong>
                <hr>
                {% for curso in current_user.cursos.split(";") %}
                    <button type="button" class="btn btn-success mt-2" disabled>{{curso}}</button>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
