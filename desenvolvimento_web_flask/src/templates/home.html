{% extends "base.html" %}

{% block body %}

    <div class="container">
        <h1 style="color: blue;">Comunidade Python</h1>
        <h3>Alunos, experts e galera do Python</h3>
        <hr>
        {% for post in posts %}
            <div class="row border mt-4 p-3 meupost">
                <div class="col col-3">
                    <div class="image pe-2">
                        <img src="{{url_for('static', filename='fotos_perfil/{}'.format(post.autor.foto_perfil))}}" class="rounded" width="200">
                        <strong>{{post.autor.username}}</strong>
                        <div class="col col-4" style="text-align: center;">
                            <strong>Curso</strong>
                            {% for curso in post.autor.cursos.split(";") %}
                                <button type="button" class="btn btn-success mt-2" disabled>{{curso}}</button>
                            {% endfor %}
                        </div>
                    </div>
                </div>
                <div class="col col-9">
                    <a style="text-decoration: none;" href="{{url_for('main.exibir_post', post_id=post.id)}}"><h3>{{post.titulo}}</h3></a> 
                    <p>{{post.corpo}}</p>
                </div>
        {% endfor %}
    </div>
    
{% endblock %}
